# TEMPLATE ONLY -- do not fill in real values here and commit this file.
# Kubernetes Secrets are base64-ENCODED, not encrypted, by default -- anyone
# who can read this file (or the repo history) can read the values. Use one
# of these instead:
#
#   kubectl create secret generic os-health-check-secrets \
#     --namespace os-health-check \
#     --from-literal=DATABASE_URL='postgresql://user:pass@host:5432/dbname?sslmode=require' \
#     --from-literal=OPENAI_API_KEY='sk-...' \
#     --from-literal=GEMINI_API_KEY='' \
#     --from-literal=OPENROUTER_API_KEY=''
#
# or, for a GitOps workflow, encrypt this shape with sealed-secrets / SOPS /
# your cluster's external-secrets operator before it ever touches git.
#
# Every key below is optional EXCEPT DATABASE_URL, which is required
# together with the ConfigMap's LOOKUP_DB_ENABLED=true -- see
# base/configmap.yaml. Apply with kubectl apply -k k8s/base (or
# k8s/overlays/minikube); create this Secret by hand, never commit.
apiVersion: v1
kind: Secret
metadata:
  name: os-health-check-secrets
  namespace: os-health-check
type: Opaque
stringData:
  DATABASE_URL: "postgresql://REPLACE_ME:REPLACE_ME@REPLACE_ME:5432/REPLACE_ME?sslmode=require"
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""
  OPENROUTER_API_KEY: ""
