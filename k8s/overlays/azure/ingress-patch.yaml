# Set both hosts to your real app DNS (same value). Must match Cloudflare
# and Keycloak redirect URIs / Web origins.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: os-health-check
  namespace: os-health-check
spec:
  tls:
    - hosts:
        - app.example.com
      secretName: os-health-check-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: os-health-check
                port:
                  number: 80
