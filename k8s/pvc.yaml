# Persists _config/ (AI settings, Azure/AWS deploy profiles, and which
# vendor lookup sources are enabled + their keyword lists) across pod
# restarts/redeploys -- none of that has a Postgres-backed equivalent, it's
# always file-based regardless of DB mode (see vendor_settings.py's
# default_prefs_path and app.py's CONFIG_DIR).
#
# Deliberately does NOT cover _data/ -- that directory holds the seed CSV
# (_data/eol_lookup.csv) baked into the image, which docker/import_if_empty.py
# reads on first boot to populate an empty Postgres database. Mounting a
# volume there too would start EMPTY and shadow that seed file, the same
# bug class already hit once with a stale Docker bind mount (see
# docker-compose.yml's history) -- so _data/ stays purely part of the image,
# never a volume, in this deployment.
#
# ReadWriteOnce is correct for a single replica. If you ever scale this
# Deployment beyond 1 replica, this PVC needs to become ReadWriteMany (not
# every cluster/StorageClass supports that) or the settings need to move
# somewhere shared (e.g. into Postgres) instead -- ask before assuming
# either approach when that day comes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: os-health-check-config
  namespace: os-health-check
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
  # storageClassName intentionally omitted -- uses your cluster's default
  # StorageClass (AKS: managed-csi, EKS: gp2/gp3, depending on setup). Set
  # this explicitly if your cluster doesn't have a default configured.
