# Single replica -- see pvc.yaml's comment before scaling this up; the
# _config/ persistent volume is ReadWriteOnce and Draft/Publish concurrency
# was designed around one shared Postgres with one app instance, not several
# instances editing at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-health-check
  namespace: os-health-check
spec:
  replicas: 1
  strategy:
    type: Recreate
    # Recreate, not RollingUpdate: with only one ReadWriteOnce _config/
    # volume, a rolling update would try to start the NEW pod (which also
    # wants to mount that same volume) before the OLD pod releases it --
    # it would just hang. Recreate stops the old pod first, so the volume
    # is free by the time the new one starts. This means a brief outage on
    # every deploy (acceptable for a single-replica setup); once/if you
    # move to multiple replicas with shared storage, revisit this.
  selector:
    matchLabels:
      app: os-health-check
  template:
    metadata:
      labels:
        app: os-health-check
    spec:
      containers:
        - name: os-health-check
          # Replace with your actual Docker Hub image (build + push this
          # from the repo root: `docker build -t <you>/os-health-check:TAG .`
          # then `docker push <you>/os-health-check:TAG`). Avoid ":latest"
          # once you're past initial testing -- it makes rollbacks and
          # "which build is actually running" much harder to reason about.
          image: docker.io/REPLACE_ME/os-health-check:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: os-health-check-config
            - secretRef:
                name: os-health-check-secrets
          volumeMounts:
            - name: config
              mountPath: /app/_config
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            # Generous initial delay -- on a completely fresh Postgres, the
            # container's entrypoint runs the first-boot import (see
            # docker/import_if_empty.py) BEFORE uvicorn even starts, and a
            # remote/managed Postgres over the network is slower than the
            # local Docker networking this was tuned against.
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Starting point, not a measured production number -- adjust
            # after watching real usage (kubectl top pod).
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: os-health-check-config
