# LoadBalancer: the simplest option that works the same way on both AKS and
# EKS without needing an Ingress controller installed first -- the cloud
# provisions an external load balancer with a public IP automatically.
# Fine to start with; switch to ClusterIP + an Ingress resource later if you
# want a custom domain, TLS termination, or to route more than one service
# through a single load balancer.
apiVersion: v1
kind: Service
metadata:
  name: os-health-check
  namespace: os-health-check
spec:
  type: LoadBalancer
  selector:
    app: os-health-check
  ports:
    - port: 80
      targetPort: 8000
