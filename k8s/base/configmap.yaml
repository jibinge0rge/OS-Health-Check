# Non-secret configuration. Credentials belong in a Secret (see
# ../secret.example.yaml). Edit DEPLOYMENT_ID / Keycloak / audience here
# before cloud apply. Minikube overlay patches these for local Keycloak.
apiVersion: v1
kind: ConfigMap
metadata:
  name: os-health-check-config
  namespace: os-health-check
data:
  APP_PORT: "8000"
  UVICORN_RELOAD: "false"
  LOOKUP_DB_ENABLED: "true"
  DEPLOYMENT_ID: "CHANGE-ME"
  KEYCLOAK_ISSUER_URL: "https://keycloak.example.com/realms/os-health-check"
  KEYCLOAK_AUDIENCE: "os-health-check-web"
  KEYCLOAK_PUBLISHER_ROLE: "lookup-publisher"
