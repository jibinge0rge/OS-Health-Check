# HTTPS Ingress (ingress-nginx + cert-manager). Edit both host fields to your
# app DNS. Minikube overlay deletes this. ssl-redirect false until Certificate
# Ready; then annotate ssl-redirect=true (see Azure/AWS production test plans).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: os-health-check
  namespace: os-health-check
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.example.com
      secretName: os-health-check-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: os-health-check
                port:
                  number: 80
