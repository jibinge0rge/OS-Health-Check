<aside class="side-panel" id="filters-panel" hidden>
  <div class="side-panel-header">
    <span class="side-panel-title">Column filters</span>
    <button class="btn tertiary" id="filters-clear-btn" type="button">Clear</button>
    <button class="icon-btn" id="filters-collapse-btn" type="button" aria-label="Close column filters"></button>
  </div>
  <div class="side-panel-body" id="filters-panel-body">

    <div class="filter-section" data-filter-field="os">
      <div class="filter-section-label">OS string</div>
      <div class="filter-mode-chips" data-modes="all,contains,excludes,equals,empty,not_empty"></div>
      <input type="text" class="text-input small" data-filter-text placeholder="Contains…" />
    </div>

    <div class="filter-section" data-filter-field="detailed">
      <div class="filter-section-label">Normalized detailed name</div>
      <div class="filter-mode-chips" data-modes="all,contains,excludes,equals,empty,not_empty"></div>
      <input type="text" class="text-input small" data-filter-text placeholder="Contains…" />
    </div>

    <div class="filter-section" data-filter-field="norm">
      <div class="filter-section-label">Normalized OS</div>
      <div class="filter-mode-chips" data-modes="all,contains,excludes,equals,empty,not_empty"></div>
      <input type="text" class="text-input small" data-filter-text placeholder="Contains…" />
    </div>

    <div class="filter-section" data-filter-field="eol">
      <div class="filter-section-label">EOL date</div>
      <button type="button" class="date-range-trigger" data-range-trigger>
        <span data-range-label>Any date</span>
      </button>
    </div>

    <div class="filter-section" data-filter-field="eoas">
      <div class="filter-section-label">EOAS date</div>
      <button type="button" class="date-range-trigger" data-range-trigger>
        <span data-range-label>Any date</span>
      </button>
    </div>

    <div class="filter-section" data-filter-field="src">
      <div class="filter-section-label">Matched by</div>
      <div class="filter-mode-chips" id="matched-by-chips"></div>
    </div>

    <div class="filter-section" data-filter-field="changed" id="changed-filter-section" hidden>
      <div class="filter-section-label">Type of change</div>
      <div class="segmented compact" id="changed-match-mode">
        <button type="button" class="segment active" data-changed-match="or">OR</button>
        <button type="button" class="segment" data-changed-match="and">AND</button>
        <button type="button" class="segment" data-changed-match="exact">EXACT</button>
      </div>
      <div class="filter-mode-chips" id="changed-field-chips"></div>
    </div>

  </div>
</aside>
