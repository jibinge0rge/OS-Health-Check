# OS Health Check
#
# One compose file, same behavior everywhere (local, Portainer, anywhere
# else): the app runs entirely from what's baked into the image at build
# time (COPY . . in the Dockerfile) — no bind mount. That's a deliberate
# choice, not an oversight: a bind mount is only useful if you're actively
# live-editing code on the exact host running the container, and it's a
# real liability everywhere else (a Portainer host whose git checkout is
# stale/incomplete would silently shadow the image's own good code with
# broken/missing code — which is exactly what happened before this was
# removed). To pick up local code changes, rebuild:
#   docker compose up -d --build
#
# Local:
#   cp .env.example .env   # optional AI keys
#   docker compose up --build
#
# Portainer: deploy this stack (as a Git repository stack, not the plain
# Web Editor — it needs to build from the Dockerfile) and set env in the UI:
#   OPENAI_API_KEY, GEMINI_API_KEY, OPENROUTER_API_KEY, APP_PORT
#   DATABASE_URL, LOOKUP_DB_ENABLED=true  -- BOTH required together to move
#     the published lookup/draft/evidence into Postgres (e.g. a managed
#     instance like Supabase); DATABASE_URL alone is not enough, and
#     LOOKUP_DB_ENABLED is easy to forget since it's a separate switch.
#   POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB -- only matter if you're
#     using the bundled `db` service below; ignored once DATABASE_URL points
#     elsewhere (e.g. Supabase) -- see the note on the `db` service.
#
# Vendor lookup caches live in PostgreSQL (named volume), not SQLite files.
#
# DATABASE_URL has no default here — set it in .env (it's picked up via
# env_file below), or via Portainer's stack environment variables (Portainer
# writes those into a .env file alongside this compose file, so env_file
# still picks them up). Point it at the bundled `db` service, e.g.
#   DATABASE_URL=postgresql://oshealth:oshealth@db:5432/oshealth
# or at any other reachable Postgres instance (e.g. Supabase's
# postgresql://postgres:<password>@db.<ref>.supabase.co:5432/postgres?sslmode=require).
# If you're pointing at an external instance, the bundled `db` service below
# is unused — it still starts (depends_on requires it healthy) but nothing
# reads or writes to it; remove that service and the depends_on if you'd
# rather not run a redundant local Postgres alongside it.

services:
  db:
    image: postgres:16-alpine
    container_name: os-health-check-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-oshealth}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-oshealth}"
      POSTGRES_DB: "${POSTGRES_DB:-oshealth}"
    volumes:
      - os_health_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oshealth} -d ${POSTGRES_DB:-oshealth}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  os-health-check:
    build: .
    image: os-health-check:local
    container_name: os-health-check
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_PORT: "8000"
      UVICORN_RELOAD: "${UVICORN_RELOAD:-false}"
      DATABASE_URL: "${DATABASE_URL:-}"
      LOOKUP_DB_ENABLED: "${LOOKUP_DB_ENABLED:-}"
      LOOKUP_DB_MIRROR_FILES: "${LOOKUP_DB_MIRROR_FILES:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-}"
      POSTGRES_USER: "${POSTGRES_USER:-oshealth}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-oshealth}"
      POSTGRES_DB: "${POSTGRES_DB:-oshealth}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  os_health_pg:
